    else{S.from=S.to='';initPeriod()}
    $('#rfrom').value=S.from;$('#rto').value=S.to;$('#repbody').innerHTML=repBodyHTML();
  },
  'dl-csv'(){
    if(!S.data.entries.length)return toast('Belum ada data untuk diunduh');
    const r=currentReport(false),R=ctx();saveFile('jurnalin-'+slug(r.title)+'-'+(R.from||'awal')+'_'+(R.to||'akhir')+'.csv',csvStr(r.csv));
  },
  'dl-html'(){
    if(!S.data.entries.length)return toast('Belum ada data untuk diunduh');
    const R=ctx(),r=fullReport(R,true);
    const doc='<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(S.company)+': '+r.title+'</title><style>'+EXP_CSS+'</style></head><body><h1>'+esc(S.company)+'</h1><p class="sub">'+r.title+', '+esc(r.sub)+'</p>'+r.html+'<\/body></html>';
    saveFile('laporan-keuangan-'+slug(S.company)+'.html',doc);
  }
};
document.addEventListener('click',e=>{
  const rb=e.target.closest&&e.target.closest('.btn,.pillbtn');if(rb&&!rb.disabled)ripple(rb,e);
  if(e.target.classList&&e.target.classList.contains('mback')&&S.modal&&!S.modal.forced){closeModal();return}
  const g=e.target.closest&&e.target.closest('.fn[data-go]');
  if(g){const v=g.dataset.go.split(':');if(v[1])S.repTab=v[1];go(v[0]);if(v[1]&&S.view==='reports')renderView();return}
  const b=e.target.closest&&e.target.closest('[data-act]');if(!b)return;
  const h=ACT[b.dataset.act];if(h)h(b,e);
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&S.user){e.preventDefault();if(S.modal&&S.modal.t==='pal')closeModal();else ACT.pal();return}
  if(S.modal&&S.modal.t==='pal'){const M=S.modal;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const n=M.list.length;if(n){M.i=(M.i+(e.key==='ArrowDown'?1:-1)+n)%n;$('#pl').innerHTML=palListHTML(M);const o=$('#pl .pi.on');if(o)o.scrollIntoView({block:'nearest'})}return}
    if(e.key==='Enter'){e.preventDefault();palRun(M.i);return}}
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('[data-f="amt"]')){e.preventDefault();const all=$$('[data-f="amt"]'),i=all.indexOf(e.target);if(i<all.length-1)all[i+1].focus();else{ACT.addline();const sel=$$('[data-f="acc"]');if(sel.length)sel[sel.length-1].focus()}return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.fn[data-go]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
  if(e.key==='Escape'&&S.modal&&!S.modal.forced)closeModal();
  if(e.key==='Enter'&&S.modal&&S.modal.t==='form'&&e.target.matches&&e.target.matches('[data-mf]')){e.preventDefault();saveForm()}
});
document.addEventListener('submit',e=>{if(e.target.id==='authform'){e.preventDefault();submitAuth()}});
document.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset)return;
  if(t.dataset.f==='amt'){
    const digits=t.value.replace(/\D/g,'').slice(0,13),caret=t.value.slice(0,t.selectionStart).replace(/\D/g,'').length,amt=digits?parseInt(digits,10):0;
    S.form.lines[lineIdx(t)].amt=amt;const f=amt?fmt(amt):'';t.value=f;
    let pos=0,seen=0;while(pos<f.length&&seen<caret){if(/\d/.test(f[pos]))seen++;pos++}
    try{t.setSelectionRange(pos,pos)}catch(_){}
    updateValid();
  }else if(t.dataset.f==='desc'){S.form.desc=t.value;updateValid()}
  else if(t.dataset.pf){if(S.modal&&S.modal.pf)S.modal.pf[t.dataset.pf]=t.value}
  else if(t.id==='au'){kodeToggle()}
  else if(t.id==='palq'){S.modal.q=t.value;S.modal.i=0;$('#pl').innerHTML=palListHTML(S.modal)}
  else if(t.id==='jq'){S.jq=t.value;$('#jlist').innerHTML=jlistHTML()}
  else if(t.id==='mq'){S.mq=t.value;$('#mbody').innerHTML=mbodyHTML()}
  else if(t.dataset.fl==='label'){const i=+t.closest('.step').dataset.i;S.data.flow[i].label=t.value;persistFlow();refreshFreeSvg()}
});
document.addEventListener('change',e=>{
  const t=e.target;if(!t.dataset)return;
  if(t.dataset.f==='acc'){
    const l=S.form.lines[lineIdx(t)];l.acc=t.value;
    if(t.value&&!l.touched){l.side=AMAP[t.value].nb;const seg=$('[data-f="side"]',t.closest('.line'));setSeg(seg,l.side)}
    updateValid();
  }else if(t.dataset.mf==='t'){const nb=$('[data-mf="nb"]');if(nb&&!nb.disabled)nb.value=(t.value==='A'||t.value==='X')?'D':'K'}
  else if(t.dataset.f==='date'){S.form.date=t.value;updateValid()}
  else if(t.id==='jf'){S.jf=t.value;$('#jlist').innerHTML=jlistHTML()}
  else if(t.id==='jt'){S.jt=t.value;$('#jlist').innerHTML=jlistHTML()}
  else if(t.id==='rfrom'){S.from=t.value;$('#repbody').innerHTML=repBodyHTML()}
  else if(t.id==='rto'){S.to=t.value;$('#repbody').innerHTML=repBodyHTML()}
  else if(t.id==='ledsel'){S.ledger=t.value;$('#repbody').innerHTML=repBodyHTML()}
  else if(t.id==='flowsel'){S.flowEntry=+t.value;renderFlowBody()}
  else if(t.dataset.fl==='loop'){const i=+t.closest('.step').dataset.i;S.data.flow[i].loop=t.value||null;persistFlow();refreshFreeSvg()}
});

document.addEventListener('mouseout',e=>{
  const t=e.target.closest&&e.target.closest('.dseg,.dleg');if(!t)return;
  const n=e.relatedTarget;if(n&&n.closest&&n.closest('.dseg,.dleg'))return;

});
/* dock: pil mengikuti kursor (hover), bisa diseret, lepas = pilih */
let dragging=false,hovering=false,dragX0=0,dragMoved=false;
const dockBtn=x=>{let best=null,bd=1e9;$$('#dock button').forEach(b=>{const r=b.getBoundingClientRect();if(r.width<2)return;const d=Math.abs(x-(r.left+r.right)/2);if(d<bd){bd=d;best=b}});return best};
function litDock(btn){if(!btn||btn.classList.contains('on'))return;try{navigator.vibrate&&navigator.vibrate(6)}catch(_){}$$('#dock button').forEach(b=>b.classList.toggle('on',b===btn));moveLens(true)}
function restoreDock(){const b=$('#dock button[data-v="'+S.view+'"]');if(b){$$('#dock button').forEach(x=>x.classList.toggle('on',x===b));moveLens(true)}}
function dragLens(cx,follow){
  const dock=$('#dock');if(!dock)return;
  const lens=$('.lens',dock),bs=$$('button',dock).filter(b=>b.offsetWidth>2),near=dockBtn(cx),dr=dock.getBoundingClientRect();
  if(!near||!bs.length)return;
  const first=bs[0],last=bs[bs.length-1],lw=near.offsetWidth+Math.round(near.offsetWidth*.36),
    x=Math.max(first.offsetLeft-4,Math.min(last.offsetLeft+last.offsetWidth-lw+4,follow?cx-dr.left-dock.clientLeft-lw/2:near.offsetLeft+near.offsetWidth/2-lw/2));
  lens.style.transition='transform .16s cubic-bezier(.22,1,.36,1),width .5s cubic-bezier(.34,1.56,.64,1),top .3s cubic-bezier(.22,1,.36,1),bottom .3s cubic-bezier(.22,1,.36,1)';
  lens.style.width=lw+'px';lens.style.transform='translateX('+x+'px)';lens._x0=x;lens._w0=lw;
  bs.forEach(b=>b.classList.toggle('on',b===near));
}
function endDrag(commit){
  if(!dragging)return;dragging=false;
  const d=$('#dock');if(!d)return;
  d.classList.remove('drag');const ln=$('.lens',d);ln.style.transition='';ln._x=null;ln.firstElementChild.style.transform='';
  const on=$('button.on',d);
  if(commit&&on&&on.dataset.v!==S.view)go(on.dataset.v);else restoreDock();
}
document.addEventListener('pointerdown',e=>{const d=e.target.closest&&e.target.closest('#dock');if(!d)return;dragging=true;d.classList.add('drag');litDock(dockBtn(e.clientX));dragX0=e.clientX;dragMoved=false;dragLens(e.clientX,false)});
document.addEventListener('pointerup',()=>endDrag(true));
document.addEventListener('pointercancel',()=>endDrag(false));
document.addEventListener('pointermove',e=>{
  const dock=$('#dock');if(!dock)return;
  if(dragging){if(Math.abs(e.clientX-dragX0)>8)dragMoved=true;dragLens(e.clientX,dragMoved);return}
  if(e.pointerType!=='mouse')return;
  if(e.target.closest&&e.target.closest('#dock')){hovering=true;litDock(dockBtn(e.clientX))}
});
document.addEventListener('mouseout',e=>{
  if(dragging)return;const t=e.relatedTarget;
  if(t&&t.closest&&t.closest('#dock'))return;
  if(e.target.closest&&e.target.closest('#dock'))magReset();
  if(!hovering)return;
  hovering=false;restoreDock();
});

/* ====================== mulai ====================== */
async function boot(){
  applyTheme(store.get('jr_theme')||'auto');
  if(REMOTE){
    if(getToken()){
      $('#app').innerHTML=splashHTML();
      try{
        const me=await http('GET','/auth/me');
        const data=await http('GET','/data');
        if(data.gone||(me.user.username!=='admin'&&data.meta&&data.meta.disabled)){
          try{await http('POST','/auth/logout',{})}catch(_){}
          store.del('jr_token');renderApp();toast(data.gone?'Akun ini sudah dihapus oleh admin':'Akun dinonaktifkan oleh admin');return;
        }
        openSession(me.user.username,me.user,data);return;
      }catch(e){
        if(e.status===401)store.del('jr_token');
        else toast(e.message||'Gagal memuat data');
      }
    }
    renderApp();return;
  }
  const s=store.get('jr_session');
  if(s){startSession(s);if(S.user)return}
  renderApp();
}
window.addEventListener('popstate',()=>{const v=location.hash.slice(1)||'dash';if(S.user&&!S.modal&&navItems().some(n=>n[0]===v)&&v!==S.view)go(v,true)});
window.addEventListener('beforeunload',e=>{if(S.user&&S.view==='input'&&S.form&&(S.form.desc||S.form.lines.some(l=>l.amt))){e.preventDefault();e.returnValue=''}});
boot();
})();
